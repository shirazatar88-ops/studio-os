<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סטודיו שירז עטר · מערכת ניהול</title>
<meta name="theme-color" content="#7d6040">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סטודיו שירז">
</head>
<body>
<div id="app" dir="rtl"></div>
<style>
  :root{color-scheme:light;
    --bg:#f4f1ec; --card:#ffffff; --ink:#2b2824; --muted:#6b6457;
    --line:#e6e0d6; --accent:#7d6040; --accent2:#b0906a; --soft:#f0ebe2;
    --ok:#356b47; --warn:#7d5f0e; --bad:#a23f31; --shadow:0 2px 14px rgba(60,50,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #app{font-family:"Segoe UI","Assistant",Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;transition:.15s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#6a5035}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#efe9df,#e4dccf)}
  .loginbox{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:34px 32px;width:360px;text-align:center}
  .brand{font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:4px}
  .ptitle{font-size:21px;font-weight:700;margin-bottom:2px}
  .psub{font-size:13px;color:var(--muted);margin-bottom:22px}
  .fld{text-align:right;margin-bottom:13px}
  .fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fbfaf7}
  .fld input:focus{outline:none;border-color:var(--accent)}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:4px}

  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .topin{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .proj{font-weight:700;font-size:16px}
  .proj small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .role-pill{font-size:11.5px;background:var(--soft);color:var(--accent);padding:3px 10px;border-radius:20px;font-weight:700}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);overflow-x:auto}
  .card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .kpi{font-size:30px;font-weight:800;color:var(--accent)}
  .kpi small{font-size:13px;color:var(--muted);font-weight:500}
  .klabel{font-size:12.5px;color:var(--muted);margin-top:4px}

  .sectitle{font-size:15px;font-weight:700;margin:26px 0 12px;border-right:3px solid var(--accent);padding-right:10px;display:flex;justify-content:space-between;align-items:center}

  /* catalog */
  .cat-head{font-size:13px;font-weight:700;color:var(--accent);margin:22px 0 10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .cat-head:before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--accent2)}
  .pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative}
  .pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(60,50,40,.1)}
  .pcard .pn{font-weight:700;font-size:15.5px;margin-bottom:2px}
  .pcard .pc{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .pcard .pm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
  .ctag{position:absolute;top:14px;left:14px;font-size:10.5px;background:var(--soft);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:700}

  .stage{margin-bottom:14px}
  .stage .row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:6px;gap:8px}
  .stage .nm{font-weight:600}
  .bar{height:9px;background:var(--soft);border-radius:20px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:20px;transition:width .4s}
  .rng{width:120px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;display:inline-block}
  .tag.ro{cursor:default}
  .tag.ok,.tag.done{background:#e7f0e9;color:var(--ok)}
  .tag.wait,.tag.prog{background:#faf2dc;color:var(--warn)}
  .tag.no{background:#f7e6e2;color:var(--bad)}
  .tag.todo{background:#eee9e0;color:var(--muted)}
  .money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .ipt{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px;font-family:inherit;background:#fbfaf7;width:100%}
  .delx{color:var(--bad);cursor:pointer;font-weight:700;border:none;background:none;font-size:15px}
  .addrow{margin-top:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:40px}
  .cred{display:flex;gap:16px;flex-wrap:wrap}
  .cred div{flex:1;min-width:160px}
  @media(max-width:620px){
    .wrap{padding:16px 12px 48px}
    .topin{padding:10px 12px}
    .proj{font-size:14.5px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:14px}
    .kpi{font-size:24px}
    th,td{padding:7px 5px;font-size:12.5px}
    .ipt{font-size:12px;padding:4px 5px}
    .rng{width:90px}
    .sectitle{font-size:14px;margin:20px 0 10px}
    .loginbox{width:92vw;max-width:360px}
    .pcards{grid-template-columns:1fr}
  }
  @media(max-width:380px){ .grid{grid-template-columns:1fr} }
  .authlinks{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px}
  .authlinks a{color:var(--accent);cursor:pointer;text-decoration:underline}
  .savestat{font-size:11.5px;color:var(--muted);min-width:52px;text-align:center}
  .btn:disabled{opacity:.6;cursor:default}
  .fchip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:8px;padding:2px 8px;margin:2px 0 2px 6px;font-size:12px}
  .fchip a,.plink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .upl{display:inline-block;cursor:pointer}
  textarea.ipt{resize:vertical;line-height:1.5}
  .jentry{border-top:1px solid var(--line);padding:10px 2px;font-size:13.5px}
  .jhead{display:flex;justify-content:space-between;align-items:center;color:var(--accent);margin-bottom:3px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
  .chatlist{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
  .msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;word-break:break-word}
  .msg.mine{align-self:flex-start;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-end;background:var(--soft);border-bottom-left-radius:4px}
  .mmeta{font-size:10.5px;opacity:.85;margin-bottom:2px}
  .chatform{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px}
  .chatform textarea{flex:1}
  .newmsg{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--bad);background:#f7e6e2;border-radius:8px;padding:4px 8px;text-align:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .tab{font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 16px;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .switch{font-family:inherit;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 10px 5px 12px;cursor:pointer}
  .switch .knob{width:30px;height:16px;border-radius:10px;background:#cfc7b8;position:relative;transition:.15s;flex:0 0 auto}
  .switch .knob:after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on .knob{background:var(--ok)}
  .switch.on .knob:after{right:16px}
  .visrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .visrow:last-of-type{border-bottom:none}
  .pvbanner{background:#fff4d6;border:1px solid #e6cf8f;color:#5c4708;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
  .chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
  .chk span:nth-child(2){flex:1}
  .chk.done span:nth-child(2){text-decoration:line-through;color:var(--muted)}
  table.wide{min-width:900px}
  select.ipt{min-height:30px}
  .tag.ok,.tag.done{color:var(--ok)} .tag.wait,.tag.prog{color:var(--warn)} .tag.no{color:var(--bad)} .tag.todo{color:var(--muted)}
  .delx{min-width:28px;min-height:28px}
  :focus-visible{outline:3px solid #1a5fb4;outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* --- stage1 upgrade --- */
  .filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
  .chip b{font-weight:700;color:var(--muted);margin-right:3px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on b{color:#fff}
  .alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .alert{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid}
  .alert .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .alert.bad{background:#fbeae6;border-color:#e9bdb4;color:#7c2d22}
  .alert.bad .dot{background:var(--bad)}
  .alert.warn{background:#fff4d6;border-color:#e6cf8f;color:#5c4708}
  .alert.warn .dot{background:#c9961a}
  .card.block{margin-bottom:14px}
  .chk.urgent{border-right:3px solid var(--bad);padding-right:8px}
  .pchip{font-size:11.5px;color:var(--accent);background:var(--soft);border-radius:20px;padding:2px 9px;cursor:pointer;white-space:nowrap}
  /* --- stage2: calmer, roomier UI --- */
  #app{background:#f7f5f1}
  .wrap{max-width:1120px;padding:28px 22px 90px}
  .topbar{border-bottom-color:#ebe6dd}
  .topin{max-width:1120px;padding:14px 22px}
  .proj{font-size:17px;letter-spacing:.1px}
  .card{border-radius:16px;padding:22px;border-color:#ebe6dd;box-shadow:0 1px 2px rgba(60,50,40,.04)}
  .card h3{font-size:14.5px;margin-bottom:14px}
  .grid{gap:16px;margin-bottom:6px}
  .kpi{font-weight:700;font-size:28px}
  .sectitle{border-right:none;padding-right:0;margin:40px 0 14px;font-size:13px;letter-spacing:.7px;color:var(--muted);font-weight:700;scroll-margin-top:130px}
  th{border-bottom:1px solid #ebe6dd;padding:10px 8px}
  td{border-bottom-color:#f1ede6;padding:11px 8px}
  .ipt{border-color:#e9e3d9;background:#fcfbf9;border-radius:8px;padding:6px 8px}
  .ipt:focus{outline:none;border-color:var(--accent);background:#fff}
  .btn{border-radius:10px}
  .tabs{gap:2px;padding-bottom:0;margin-bottom:24px;border-bottom:1px solid #e6e0d6}
  .tab{border:none;background:none;border-radius:0;padding:11px 16px;border-bottom:2px solid transparent;color:var(--muted);margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.on{background:none;color:var(--ink);border-bottom-color:var(--accent)}
  .secnav{position:sticky;z-index:20;background:rgba(247,245,241,.95);backdrop-filter:blur(6px);display:flex;gap:4px;overflow-x:auto;padding:10px 0;margin:-14px 0 18px;border-bottom:1px solid #e6e0d6;scrollbar-width:thin}
  .secnav button{font-family:inherit;font-size:12.5px;white-space:nowrap;border:none;background:none;color:var(--muted);padding:6px 11px;border-radius:16px;cursor:pointer}
  .secnav button:hover{background:var(--soft);color:var(--ink)}
  .tag.okb{background:#dcefe2;color:#1f5a35;font-size:12.5px;padding:4px 12px}
  tr.approved td{background:#f5faf6}
  .jmeet{margin-top:6px}
  .jmeet b{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:1px}
  .pcard{border-color:#ebe6dd;border-radius:16px;padding:20px}
  @media(max-width:620px){ .wrap{padding:18px 12px 60px} .card{padding:15px} .sectitle{margin:28px 0 10px} .tab{padding:9px 11px;font-size:13px} }
  /* --- contacts as cards --- */
  .ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:6px}
  .ccard{background:var(--card);border:1px solid #ebe6dd;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(60,50,40,.04)}
  .ccard.editing{grid-column:1/-1;border-color:var(--accent)}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .cname{font-weight:700;font-size:15.5px;line-height:1.3}
  .cperson{font-size:13px;color:var(--muted)}
  .cline{font-size:13px;text-align:right;color:var(--ink);word-break:break-all}
  .cnotes{font-size:12.5px;color:var(--muted);line-height:1.5;border-top:1px solid #f1ede6;padding-top:8px;margin-top:4px}
  .cacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
  .cact{font-family:inherit;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--accent);background:var(--soft);border:none;border-radius:16px;padding:6px 12px;cursor:pointer}
  .cact:hover{background:#e7dfd2}
  .cact.edit{background:none;border:1px solid var(--line);color:var(--muted);margin-right:auto}
  .cform{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  /* --- role menu --- */
  .rolewrap{position:relative}
  .rolebtn{border:none;cursor:pointer;font-family:inherit;padding:6px 12px;font-size:12px}
  .rolebtn.pv{background:#fff4d6;color:#5c4708}
  .rolemenu{position:absolute;top:calc(100% + 8px);left:0;min-width:250px;max-width:86vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(60,50,40,.16);padding:6px;z-index:60}
  .rolemenu[hidden]{display:none}
  .ritem{display:block;width:100%;text-align:right;font-family:inherit;border:none;background:none;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink)}
  .ritem b{display:block;font-size:13.5px}
  .ritem span{display:block;font-size:11.5px;color:var(--muted)}
  .ritem:hover{background:var(--soft)}
  .ritem.on{background:var(--soft)}
  .ritem.on b:after{content:" ✓";color:var(--ok)}
  .rhead{font-size:11px;font-weight:700;color:var(--muted);padding:10px 12px 4px;border-top:1px solid #f1ede6;margin-top:4px}
  /* --- notifications bell --- */
  .bell{position:relative;font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
  .bcount{position:absolute;top:-7px;left:-7px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:19px;text-align:center;padding:0 5px}
  .bcount[hidden]{display:none}
  .rolemenu.notif{min-width:320px;max-height:70vh;overflow-y:auto}
  .nhead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px 4px}
  .nhead span{font-size:11.5px;color:var(--muted)}
  .nitem{border-right:3px solid transparent;border-radius:6px 10px 10px 6px}
  .nitem.bad{border-right-color:var(--bad)}
  .nitem.warn{border-right-color:#c9961a}
  .nitem b{font-weight:600;font-size:13px}
  .nfoot{border-top:1px solid #f1ede6;margin-top:6px;padding:10px 12px;font-size:11.5px;color:var(--muted)}
  /* --- mobile layout --- */
  @media(max-width:720px){
    #app{padding-bottom:env(safe-area-inset-bottom)}
    .wrap{padding:16px 12px 70px}
    .topin{padding:10px 12px;gap:8px}
    .proj{flex:1 1 100%;font-size:16px}
    .trow{width:100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:2px 0 4px;scrollbar-width:none}
    .trow::-webkit-scrollbar,.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.secnav::-webkit-scrollbar{display:none}
    .trow>*{flex:0 0 auto}
    .rolewrap{position:static}
    .rolemenu,.rolemenu.notif{position:fixed;top:auto;bottom:0;left:0;right:0;min-width:0;max-width:none;max-height:75vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(40,30,20,.28);z-index:80}
    .ritem{padding:12px}
    .tabs{flex-wrap:nowrap;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
    .tab{white-space:nowrap;flex:0 0 auto;padding:10px 12px;font-size:14px}
    .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
    .chip{white-space:nowrap;flex:0 0 auto}
    .filterbar{align-items:stretch}
    .filterbar .ipt{width:100%!important;max-width:none!important;min-width:0!important;flex:1 1 100%!important}
    .secnav{margin:-6px -12px 14px;padding:8px 12px;scrollbar-width:none}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:15px;border-radius:14px}
    .kpi{font-size:22px}
    .sectitle{margin:28px 0 10px;flex-wrap:wrap;gap:6px}
    .cred{flex-direction:column;gap:10px}
    .cred>div{min-width:0!important;flex:1 1 auto!important;width:100%}
    .ipt,select.ipt,textarea.ipt,.fld input{font-size:16px}
    .btn{min-height:40px}
    .btn.sm{padding:8px 13px;font-size:13.5px}
    .switch{padding:7px 10px 7px 12px}
    .stage .row{flex-wrap:wrap}
    .rng{width:150px}
    .chk{flex-wrap:wrap;gap:8px;padding:10px 2px}
    .chk span:nth-child(2){flex:1 1 60%}
    .chatform{flex-direction:column;align-items:stretch}
    .msg{max-width:92%}
    .pcards,.ccards,.cform{grid-template-columns:1fr}
    .visrow{align-items:center}
    .loginbox{width:92vw;max-width:380px;padding:28px 20px}
    .alert{font-size:13px;padding:10px 12px}
    /* tables become one card per row */
    table.stack{display:block;min-width:0!important}

  // groups: do = לעשות, pay = לשלם / לגבות, decide = להחליט, answer = לענות / להביא תשובה
  function notifList(){
    var td=today(), soon=plusDays(3), out=[], sig=S._sig||{waiting:{},newFiles:{}};
    S.projects.forEach(function(P){
      function add(grp,lvl,txt,when){ out.push({grp:grp,lvl:lvl,txt:txt,when:when||"",pid:P.id,pname:P.name}); }
      P.tasks.forEach(function(t){ if(t.done||!t.t) return;
        var grp=t.wait?"answer":(taskCat(t)==="approvals"?"decide":"do");
        if(t.due&&t.due<td) add(grp,"bad",t.t,"באיחור · "+fmtDate(t.due));
        else if(t.due===td) add(grp,"bad",t.t,"היום");
        else if(t.due&&t.due<=soon) add(grp,"warn",t.t,fmtDate(t.due));
        else if(t.wait) add("answer","info",t.t,WAITL[t.wait]);

      if(sig.waiting[P.id]) add("answer","bad","הלקוח כתב בצ׳אט ומחכה לתשובה","");
      if(sig.newFiles[P.id]) add("answer","info","הלקוח העלה "+sig.newFiles[P.id]+" מסמכים חדשים השבוע","");

      if(offers.length) add("decide","info",offers.length+" הצעות מחיר ממתינות להחלטה: "+offers.slice(0,3).map(function(l){return l.nm.split(" · ")[0];}).join(", ")+(offers.length>3?"…":""),"");
      (P.ffe||[]).forEach(function(x){ var k=ffeRisk(P,x); if(k) add(x.status==="ordered"?"answer":"decide",k.bad?"bad":"warn","רכש · "+(x.item||x.cat).slice(0,60),k.txt); });

    out.sort(function(a,b){ return rank[a.lvl]-rank[b.lvl]; });

  var chatSig="";
  async function loadChat(P){
    var r=await sb.from("messages").select("id,sender_role,body,created_at").eq("project_id",P.id).order("created_at",{ascending:true}).limit(300);
    var el=$("chatList"); if(!el||r.error) return;
    var rows=r.data||[], sig=P.id+":"+rows.length+":"+(rows.length?rows[rows.length-1].id:0);
    if(sig===chatSig && el.dataset.sig===sig) return;
    chatSig=sig; el.dataset.sig=sig;
    if(!rows.length){ el.innerHTML='<div class="hint" style="margin:0">אין הודעות עדיין. אפשר לכתוב כאן שאלה או עדכון על הפרויקט.</div>'; return; }
    el.innerHTML=rows.map(function(m){
      var mine=m.sender_role===S.role;
      return '<div class="msg '+(mine?'mine':'theirs')+'"><div class="mmeta">'+(m.sender_role==="admin"?"שירז עטר":"הלקוח")+' · '+fmtTime(m.created_at)+'</div>'+
             '<div>'+esc(m.body).replace(/\n/g,"<br>")+'</div></div>';
    }).join("");

  function wireChat(P){
    var tx=$("chatText"), btn=$("chatSend"); if(!tx) return;
    tx.value=S.chatDraft[P.id]||"";
    tx.oninput=function(){ S.chatDraft[P.id]=tx.value; };
    btn.onclick=async function(){
      var b=tx.value.trim(); if(!b) return;
      btn.disabled=true; $("chatErr").textContent="";
      var r=await sb.from("messages").insert({project_id:P.id,sender_role:S.role,body:b});
      btn.disabled=false;
      if(r.error){ $("chatErr").textContent="ההודעה לא נשלחה — נסו שוב"; return; }
      tx.value=""; S.chatDraft[P.id]=""; loadChat(P);
    };
    loadChat(P);
    clearInterval(chatTimer);
    chatTimer=setInterval(function(){ if(!document.hidden) loadChat(P); },15000);

    if(!rows.length) h+='<div class="hint" style="margin:0">עדיין לא רוכזו כאן פריטים מהמייל. הפריטים נאספים מתיבת המייל העסקית ומופיעים כאן עם קישור למייל המקורי.</div>';
    else {
      h+='<table class="wide"><tr><th>טופל</th><th>תאריך</th><th>סוג</th><th>מאת</th><th>נושא ותקציר</th><th>פרויקט</th><th>פעולות מהירות</th><th>קישור</th><th></th></tr>';
      rows.forEach(function(x){ var k=IK[x.kind]?x.kind:"other";
        var opts='<option value="">—</option>'+S.projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===x.project_id?' selected':'')+'>'+esc(p.name)+'</option>'; }).join("");
        var lk=/^https:\/\//i.test(x.link||"")?'<a class="plink" target="_blank" rel="noopener noreferrer" href="'+esc(x.link)+'">פתיחה</a>':'';
        h+='<tr'+(x.done?' style="opacity:.5"':'')+'><td><input type="checkbox" aria-label="סימון כטופל" data-ibdone="'+x.id+'"'+(x.done?' checked':'')+'></td><td style="white-space:nowrap">'+esc(fmtDate(x.received_at))+'</td>'+
           '<td><span class="tag ro '+IC[k]+'">'+IK[k]+'</span></td><td>'+esc(x.from_name||x.from_email)+'</td><td><b>'+esc(x.subject)+'</b><div style="color:var(--muted)">'+esc(x.summary)+'</div></td>'+
           '<td><select class="ipt" aria-label="שיוך לפרויקט" data-ibproj="'+x.id+'">'+opts+'</select></td>'+
           '<td style="white-space:nowrap"><button class="btn ghost sm" data-ibtask="'+x.id+'">הפוך למשימה בפרויקט</button> <button class="btn ghost sm" data-ibquote="'+x.id+'">הוסף כהצעת מחיר לתקציב</button><div class="hint" style="margin:4px 0 0" id="ibmsg'+x.id+'"></div></td><td>'+lk+'</td><td><button class="delx" aria-label="הסרה מהרשימה" data-ibdel="'+x.id+'">×</button></td></tr>'; });
      h+='</table>';
    }
    h+='</div>';
    body.innerHTML=h;
    document.querySelectorAll('[data-ibdone]').forEach(function(el){ el.onchange=async function(){ await sb.from("inbox_items").update({done:el.checked}).eq("id",+el.dataset.ibdone); renderInbox(); }; });
    document.querySelectorAll('[data-ibproj]').forEach(function(el){ el.onchange=async function(){ await sb.from("inbox_items").update({project_id:el.value||null}).eq("id",+el.dataset.ibproj); }; });
    function ibAct(el,kind){
      var id=+el.dataset[kind], x=rows.filter(function(r){return r.id===id;})[0], msg=$("ibmsg"+id);
      var sel=document.querySelector('[data-ibproj="'+id+'"]'), P=byId(sel&&sel.value);
      if(!P){ msg.style.color="var(--bad)"; msg.textContent="יש לבחור קודם פרויקט בעמודה ״פרויקט״"; return; }
      var who=x.from_name||x.from_email||"";
      if(kind==="ibtask"){ P.tasks.push({t:(x.subject||"פריט מהמייל")+(who?" — "+who:""),pri:"mid",due:"",done:false,cat:x.kind==="quote"?"approvals":"calls",wait:""}); msg.textContent="נוספה משימה בפרויקט "+P.name+" ✓"; }
      else { P.budgetLines.push({nm:(who?who+" — ":"")+(x.subject||"הצעת מחיר"),amount:0,paid:0,status:"offer"}); msg.textContent="נוספה שורת ״בהצעה״ בתקציב של "+P.name+" — יש להשלים שם את הסכום ✓"; }
      msg.style.color="var(--ok)"; save(P); flush();
    }
    document.querySelectorAll('[data-ibtask]').forEach(function(el){ el.onclick=function(){ ibAct(el,"ibtask"); }; });
    document.querySelectorAll('[data-ibquote]').forEach(function(el){ el.onclick=function(){ ibAct(el,"ibquote"); }; });
    document.querySelectorAll('[data-ibdel]').forEach(function(el){ el.onclick=async function(){ if(!confirm("להסיר את הפריט מהרשימה? המייל עצמו לא נמחק.")) return; await sb.from("inbox_items").delete().eq("id",+el.dataset.ibdel); renderInbox(); }; });
  }

  /* ===== mobile: turn wide tables into stacked cards ===== */
  function labelTables(){
    var tables=app.querySelectorAll("table:not([data-lbl])");
    for(var i=0;i<tables.length;i++){
      var t=tables[i]; t.setAttribute("data-lbl","1");
      var rows=t.rows; if(!rows||!rows.length) continue;
      var hs=rows[0].querySelectorAll("th"); if(hs.length<3) continue;   // small 2-column tables stay as they are
      var labels=[].map.call(hs,function(h){ return h.textContent.trim(); });
      rows[0].classList.add("hrow"); t.classList.add("stack");
      for(var r=1;r<rows.length;r++){ var cs=rows[r].cells; for(var c=0;c<cs.length;c++){ if(!cs[c].hasAttribute("data-label")) cs[c].setAttribute("data-label",labels[c]||""); } }
    }
  }
  if(window.MutationObserver){
    var lblQueued=false;
    new MutationObserver(function(){ if(lblQueued) return; lblQueued=true; (window.requestAnimationFrame||setTimeout)(function(){ lblQueued=false; labelTables(); }); }).observe(app,{childList:true,subtree:true});
  }

  /* ===== boot ===== */
  var recovering=false;
  sb.auth.onAuthStateChange(function(ev){ if(ev==="PASSWORD_RECOVERY"){ recovering=true; renderNewPass(); } });
  sb.auth.getSession().then(function(r){
    if(recovering) return;
    if(r.data&&r.data.session) enter(); else renderLogin();
  });
  window.addEventListener("beforeunload",function(){ if(Object.keys(pending).length) flush(); });

  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
