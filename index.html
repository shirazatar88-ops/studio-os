<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סטודיו שירז עטר · מערכת ניהול</title>
<meta name="theme-color" content="#7d6040">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סטודיו שירז">
</head>
<body>
<div id="app" dir="rtl"></div>
<style>
  :root{color-scheme:light;
    --bg:#f4f1ec; --card:#ffffff; --ink:#2b2824; --muted:#6b6457;
    --line:#e6e0d6; --accent:#7d6040; --accent2:#b0906a; --soft:#f0ebe2;
    --ok:#356b47; --warn:#7d5f0e; --bad:#a23f31; --shadow:0 2px 14px rgba(60,50,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #app{font-family:"Segoe UI","Assistant",Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;transition:.15s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#6a5035}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#efe9df,#e4dccf)}
  .loginbox{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:34px 32px;width:360px;text-align:center}
  .brand{font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:4px}
  .ptitle{font-size:21px;font-weight:700;margin-bottom:2px}
  .psub{font-size:13px;color:var(--muted);margin-bottom:22px}
  .fld{text-align:right;margin-bottom:13px}
  .fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fbfaf7}
  .fld input:focus{outline:none;border-color:var(--accent)}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:4px}

  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .topin{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .proj{font-weight:700;font-size:16px}
  .proj small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .role-pill{font-size:11.5px;background:var(--soft);color:var(--accent);padding:3px 10px;border-radius:20px;font-weight:700}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);overflow-x:auto}
  .card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .kpi{font-size:30px;font-weight:800;color:var(--accent)}
  .kpi small{font-size:13px;color:var(--muted);font-weight:500}
  .klabel{font-size:12.5px;color:var(--muted);margin-top:4px}

  .sectitle{font-size:15px;font-weight:700;margin:26px 0 12px;border-right:3px solid var(--accent);padding-right:10px;display:flex;justify-content:space-between;align-items:center}

  /* catalog */
  .cat-head{font-size:13px;font-weight:700;color:var(--accent);margin:22px 0 10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .cat-head:before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--accent2)}
  .pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative}
  .pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(60,50,40,.1)}
  .pcard .pn{font-weight:700;font-size:15.5px;margin-bottom:2px}
  .pcard .pc{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .pcard .pm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
  .ctag{position:absolute;top:14px;left:14px;font-size:10.5px;background:var(--soft);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:700}

  .stage{margin-bottom:14px}
  .stage .row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:6px;gap:8px}
  .stage .nm{font-weight:600}
  .bar{height:9px;background:var(--soft);border-radius:20px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:20px;transition:width .4s}
  .rng{width:120px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;display:inline-block}
  .tag.ro{cursor:default}
  .tag.ok,.tag.done{background:#e7f0e9;color:var(--ok)}
  .tag.wait,.tag.prog{background:#faf2dc;color:var(--warn)}
  .tag.no{background:#f7e6e2;color:var(--bad)}
  .tag.todo{background:#eee9e0;color:var(--muted)}
  .money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .ipt{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px;font-family:inherit;background:#fbfaf7;width:100%}
  .delx{color:var(--bad);cursor:pointer;font-weight:700;border:none;background:none;font-size:15px}
  .addrow{margin-top:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:40px}
  .cred{display:flex;gap:16px;flex-wrap:wrap}
  .cred div{flex:1;min-width:160px}
  @media(max-width:620px){
    .wrap{padding:16px 12px 48px}
    .topin{padding:10px 12px}
    .proj{font-size:14.5px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:14px}
    .kpi{font-size:24px}
    th,td{padding:7px 5px;font-size:12.5px}
    .ipt{font-size:12px;padding:4px 5px}
    .rng{width:90px}
    .sectitle{font-size:14px;margin:20px 0 10px}
    .loginbox{width:92vw;max-width:360px}
    .pcards{grid-template-columns:1fr}
  }
  @media(max-width:380px){ .grid{grid-template-columns:1fr} }
  .authlinks{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px}
  .authlinks a{color:var(--accent);cursor:pointer;text-decoration:underline}
  .savestat{font-size:11.5px;color:var(--muted);min-width:52px;text-align:center}
  .btn:disabled{opacity:.6;cursor:default}
  .fchip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:8px;padding:2px 8px;margin:2px 0 2px 6px;font-size:12px}
  .fchip a,.plink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .upl{display:inline-block;cursor:pointer}
  textarea.ipt{resize:vertical;line-height:1.5}
  .jentry{border-top:1px solid var(--line);padding:10px 2px;font-size:13.5px}
  .jhead{display:flex;justify-content:space-between;align-items:center;color:var(--accent);margin-bottom:3px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
  .chatlist{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
  .msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;word-break:break-word}
  .msg.mine{align-self:flex-start;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-end;background:var(--soft);border-bottom-left-radius:4px}
  .mmeta{font-size:10.5px;opacity:.85;margin-bottom:2px}
  .chatform{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px}
  .chatform textarea{flex:1}
  .newmsg{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--bad);background:#f7e6e2;border-radius:8px;padding:4px 8px;text-align:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .tab{font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 16px;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .switch{font-family:inherit;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 10px 5px 12px;cursor:pointer}
  .switch .knob{width:30px;height:16px;border-radius:10px;background:#cfc7b8;position:relative;transition:.15s;flex:0 0 auto}
  .switch .knob:after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on .knob{background:var(--ok)}
  .switch.on .knob:after{right:16px}
  .visrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .visrow:last-of-type{border-bottom:none}
  .pvbanner{background:#fff4d6;border:1px solid #e6cf8f;color:#5c4708;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
  .chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
  .chk span:nth-child(2){flex:1}
  .chk.done span:nth-child(2){text-decoration:line-through;color:var(--muted)}
  table.wide{min-width:900px}
  select.ipt{min-height:30px}
  .tag.ok,.tag.done{color:var(--ok)} .tag.wait,.tag.prog{color:var(--warn)} .tag.no{color:var(--bad)} .tag.todo{color:var(--muted)}
  .delx{min-width:28px;min-height:28px}
  :focus-visible{outline:3px solid #1a5fb4;outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SB_URL="https://lugrtbedmrntcalgkikt.supabase.co";
  var SB_KEY="sb_publishable_dPXXyx-vhCMWBaUNNOAauQ_eUwN_6gu";
  var app=document.getElementById("app");
  if(!window.supabase){ app.innerHTML='<div style="padding:40px;text-align:center">לא ניתן לטעון את המערכת. בדקי חיבור לאינטרנט ורענני.</div>'; return; }
  var sb=window.supabase.createClient(SB_URL,SB_KEY);

  var S={role:null, view:"home", projects:[], activeId:null, email:"", showNew:false, chatDraft:{}, tab:"today", preview:false, contacts:[]};
  var chatTimer=null;
  var refreshTimer=null;

  /* ===== helpers ===== */
  function money(n){ return "₪"+(+n||0).toLocaleString("en-US"); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function daysLeft(d){ if(!d) return null; var t=new Date(d+"T00:00:00"); var now=new Date(); now.setHours(0,0,0,0); return Math.round((t-now)/86400000); }
  function overall(P){ var s=P.stages; if(!s.length) return 0; return Math.round(s.reduce(function(a,b){return a+(+b.pct||0);},0)/s.length); }
  function $(id){ return document.getElementById(id); }
  function byId(id){ return S.projects.filter(function(p){return p.id===id;})[0]; }
  function active(){ return byId(S.activeId)||S.projects[0]; }

  function fromRow(r){
    var d=r.data||{};
    var lines=d.budgetLines;
    if(!lines){ // one-time migration from the old three totals
      lines=[]; var b=d.budget||{};
      if(+b.committed) lines.push({nm:"מחויב · יתרת פתיחה",amount:+b.committed,paid:0,status:"commit"});
      if(+b.offers)    lines.push({nm:"בהצעות מחיר · יתרת פתיחה",amount:+b.offers,paid:0,status:"offer"});
      if(+b.estimates) lines.push({nm:"הערכות · יתרת פתיחה",amount:+b.estimates,paid:0,status:"est"});
    }
    return { id:r.id, name:r.name||"", client:r.client_name||"", category:r.category||"כללי",
      clientEmail:r.client_email||"", designer:r.designer||"שירז עטר · אדריכלות ועיצוב פנים",
      shoppingDeadline:r.shopping_deadline||"",
      stages:d.stages||[], payments:d.payments||[], suppliers:d.suppliers||[], plans:d.plans||[],
      budgetLines:lines, tasks:d.tasks||[], journal:d.journal||[], docs:d.docs||[], vis:d.vis||{} };
  }
  function toRow(P){
    return { name:P.name||"פרויקט", client_name:P.client||"", category:P.category||"כללי",
      client_email:(P.clientEmail&&P.clientEmail.trim())?P.clientEmail.trim().toLowerCase():null,
      shopping_deadline:P.shoppingDeadline||null,
      data:{stages:P.stages,payments:P.payments,suppliers:P.suppliers,plans:P.plans,
            budgetLines:P.budgetLines,tasks:P.tasks,journal:P.journal,docs:P.docs,vis:P.vis||{}} };
  }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function fmtDate(s){ if(!s) return ""; var p=String(s).slice(0,10).split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : s; }
  function allFiles(P){ var a=P.docs.map(function(f){return f.path;}); P.plans.forEach(function(p){ (p.files||[]).forEach(function(f){ a.push(f.path); }); }); return a; }
  async function openFile(path){
    var w=window.open("about:blank","_blank");
    var r=await sb.storage.from("plans").createSignedUrl(path,300);
    if(r.error||!r.data){ if(w) w.close(); setStat("לא ניתן לפתוח את הקובץ",true); return; }
    if(w) w.location=r.data.signedUrl; else location.href=r.data.signedUrl;
  }
  function wireFiles(){ document.querySelectorAll('[data-file]').forEach(function(el){ el.onclick=function(){ openFile(el.dataset.file); }; }); }
  function defaultStages(){
    return [{nm:"שלב א' · תכנון ואפיון",pct:0},{nm:"שלב ב' · תכניות עבודה ואישורים",pct:0},
            {nm:"שלב ג' · ביצוע ובנייה",pct:0},{nm:"שלב ד' · גמרים ומסירה",pct:0}];
  }

  /* ===== saving (admin) ===== */
  var saveTimer=null, pending={};
  function setStat(t,bad){ var e=$("saveStat"); if(e){ e.textContent=t; e.style.color=bad?"var(--bad)":"var(--muted)"; } }
  function save(P){ pending[P.id]=P; setStat("שומר…"); clearTimeout(saveTimer); saveTimer=setTimeout(flush,600); }
  async function flush(){
    var ids=Object.keys(pending), list=ids.map(function(k){return pending[k];}); pending={};
    for(var i=0;i<list.length;i++){
      var r=await sb.from("projects").update(toRow(list[i])).eq("id",list[i].id);
      if(r.error){ setStat("שגיאת שמירה — בדקי חיבור",true); pending[list[i].id]=list[i]; return; }
    }
    setStat("נשמר ✓");
  }

  /* ===== auth screens ===== */
  function authShell(inner){
    app.innerHTML='<div id="login"><div class="loginbox">'+
      '<div class="brand">SHIRAZ ATAR · STUDIO</div>'+
      '<div class="ptitle">מערכת ניהול הסטודיו</div>'+
      '<div class="psub">ניהול פרויקטים · אדריכלות ועיצוב פנים</div>'+inner+'</div></div>';
  }
  function renderLogin(msg, ok){
    authShell(
      '<div class="fld"><label>אימייל</label><input id="em" type="email" autocomplete="username" dir="ltr"></div>'+
      '<div class="fld"><label>סיסמה</label><input id="pw" type="password" autocomplete="current-password" dir="ltr"></div>'+
      '<div class="err" id="authMsg" style="'+(ok?'color:var(--ok)':'')+'">'+(msg||"")+'</div>'+
      '<button class="btn primary" style="width:100%;margin-top:6px" id="loginBtn">כניסה</button>'+
      '<div class="authlinks"><a id="toSignup">כניסה ראשונה? יצירת סיסמה</a><a id="toForgot">שכחתי סיסמה</a></div>');
    async function go(){
      var em=$("em").value.trim(), pw=$("pw").value;
      if(!em||!pw){ $("authMsg").textContent="יש למלא אימייל וסיסמה"; return; }
      $("loginBtn").disabled=true;
      var r=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error){ $("loginBtn").disabled=false;
        $("authMsg").textContent = /confirm/i.test(r.error.message) ? "יש לאשר קודם את המייל שנשלח אלייך" : "אימייל או סיסמה שגויים"; return; }
      enter();
    }
    $("loginBtn").onclick=go;
    $("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
    $("toSignup").onclick=function(){ renderSignup(); };
    $("toForgot").onclick=function(){ renderForgot(); };
  }
  function renderSignup(msg){
    authShell(
      '<div class="hint" style="margin-bottom:12px;text-align:right">כניסה ראשונה: הזיני את האימייל שלך ובחרי סיסמה. יישלח אלייך מייל לאישור.</div>'+
      '<div class="fld"><label>אימייל</label><input id="em" type="email" autocomplete="username" dir="ltr"></div>'+
      '<div class="fld"><label>סיסמה חדשה (6 תווים לפחות)</label><input id="pw" type="password" autocomplete="new-password" dir="ltr"></div>'+
      '<div class="err" id="authMsg">'+(msg||"")+'</div>'+
      '<button class="btn primary" style="width:100%;margin-top:6px" id="suBtn">יצירת חשבון</button>'+
      '<div class="authlinks"><a id="toLogin">חזרה לכניסה</a></div>');
    $("toLogin").onclick=function(){ renderLogin(); };
    $("suBtn").onclick=async function(){
      var em=$("em").value.trim(), pw=$("pw").value;
      if(!em||pw.length<6){ $("authMsg").textContent="אימייל תקין וסיסמה של 6 תווים לפחות"; return; }
      $("suBtn").disabled=true;
      var r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
      if(r.error){ $("suBtn").disabled=false; $("authMsg").textContent="לא ניתן ליצור חשבון: "+r.error.message; return; }
      if(r.data&&r.data.session){ enter(); return; }
      renderLogin("נשלח מייל אישור. לחצי על הקישור שבו ואז היכנסי כאן.", true);
    };
  }
  function renderForgot(){
    authShell(
      '<div class="fld"><label>אימייל</label><input id="em" type="email" dir="ltr"></div>'+
      '<div class="err" id="authMsg"></div>'+
      '<button class="btn primary" style="width:100%;margin-top:6px" id="fgBtn">שליחת קישור לאיפוס</button>'+
      '<div class="authlinks"><a id="toLogin">חזרה לכניסה</a></div>');
    $("toLogin").onclick=function(){ renderLogin(); };
    $("fgBtn").onclick=async function(){
      var em=$("em").value.trim(); if(!em){ $("authMsg").textContent="יש להזין אימייל"; return; }
      await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
      renderLogin("אם האימייל רשום, נשלח אליו קישור לאיפוס סיסמה.", true);
    };
  }
  function renderNewPass(){
    authShell(
      '<div class="fld"><label>סיסמה חדשה (6 תווים לפחות)</label><input id="pw" type="password" autocomplete="new-password" dir="ltr"></div>'+
      '<div class="err" id="authMsg"></div>'+
      '<button class="btn primary" style="width:100%;margin-top:6px" id="npBtn">שמירת סיסמה</button>');

  async function enter(){
    app.innerHTML='<div style="padding:60px;text-align:center;color:var(--muted)">טוען…</div>';
    clearInterval(refreshTimer);
    try{
      var u=await sb.auth.getUser();
      if(u.error||!u.data.user){ renderLogin(); return; }
      S.email=u.data.user.email||"";
      var a=await sb.rpc("is_admin"); if(a.error) throw a.error;
      if(a.data===true){ S.role="admin"; await loadAdmin(); S.view="home"; }
      else {
        S.role="client"; await loadClient();
        if(S.projects.length===1){ S.activeId=S.projects[0].id; S.view="project"; } else S.view="home";
        refreshTimer=setInterval(clientRefresh,30000);
      }
      renderApp();

  async function clientRefresh(){
    if(S.role!=="client"||document.hidden) return;
    var ae=document.activeElement, ct=$("chatText"), cn=$("cfNote"), ca=$("cfAmount"), cf=$("cfFile");
    if((ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))||(ct&&ct.value)||(cn&&cn.value)||(ca&&ca.value)||(cf&&cf.files&&cf.files.length)) return; // don't interrupt typing
    try{ await loadClient(); var y=window.scrollY; renderApp(); window.scrollTo(0,y); }catch(e){}
  }

  function wireAdmin(P){
    function re(){ save(P); renderAdmin(); }
    $("pName").onchange=function(e){ P.name=e.target.value; save(P); };
    $("pClient").onchange=function(e){ P.client=e.target.value; save(P); };
    $("pCat").onchange=function(e){ P.category=e.target.value||"כללי"; save(P); };
    $("cEmail").onchange=function(e){ P.clientEmail=e.target.value.trim(); save(P); };
    $("dlDate").onchange=function(e){ P.shoppingDeadline=e.target.value; re(); };
    $("delProj").onclick=async function(){
      if(!confirm('למחוק את הפרויקט "'+P.name+'"? פעולה בלתי הפיכה.')) return;
      delete pending[P.id];
      var fl=allFiles(P);
      var cfr=await sb.from("client_files").select("path").eq("project_id",P.id); (cfr.data||[]).forEach(function(x){ fl.push(x.path); });
      if(fl.length) await sb.storage.from("plans").remove(fl);

      if(r.error){ setStat("המחיקה נכשלה",true); return; }

    };
    document.querySelectorAll('[data-stage]').forEach(function(el){
      el.oninput=function(){ P.stages[+el.dataset.stage].pct=+el.value; el.nextElementSibling.textContent=el.value+'%'; };
      el.onchange=re;
    });
    var ap=$("addPay"); if(ap) ap.onclick=function(){ P.payments.push({title:"אבן דרך חדשה",amount:0,paid:false}); re(); };
    document.querySelectorAll('[data-pay]').forEach(function(el){ el.onclick=function(){ var i=+el.dataset.pay; P.payments[i].paid=!P.payments[i].paid; re(); }; });
    document.querySelectorAll('[data-delpay]').forEach(function(el){ el.onclick=function(){ P.payments.splice(+el.dataset.delpay,1); re(); }; });
    document.querySelectorAll('[data-payf]').forEach(function(el){ el.onchange=function(){ P.payments[+el.dataset.i][el.dataset.payf]= el.dataset.payf==="amount"?(+el.value||0):el.value; re(); }; });
    var as=$("addSup"); if(as) as.onclick=function(){ P.suppliers.push({nm:"ספק חדש",trade:"",status:"no",note:""}); re(); };
    document.querySelectorAll('[data-sup]').forEach(function(el){ el.onclick=function(){ var i=+el.dataset.sup; P.suppliers[i].status=({ok:"wait",wait:"no",no:"ok"})[P.suppliers[i].status]||"no"; re(); }; });
    document.querySelectorAll('[data-delsup]').forEach(function(el){ el.onclick=function(){ P.suppliers.splice(+el.dataset.delsup,1); re(); }; });
    document.querySelectorAll('[data-sfield]').forEach(function(el){ el.onchange=function(){ P.suppliers[+el.dataset.i][el.dataset.sfield]=el.value; save(P); }; });
    var apl=$("addPlan"); if(apl) apl.onclick=function(){ P.plans.push({nm:"תכנית חדשה",status:"todo"}); re(); };
    document.querySelectorAll('[data-plan]').forEach(function(el){ el.onclick=function(){ var i=+el.dataset.plan; P.plans[i].status=({done:"prog",prog:"todo",todo:"done"})[P.plans[i].status]||"todo"; re(); }; });
    document.querySelectorAll('[data-delplan]').forEach(function(el){ el.onclick=async function(){
      var i=+el.dataset.delplan, fl=(P.plans[i].files||[]).map(function(f){return f.path;});
      if(fl.length){ if(!confirm("למחוק את התכנית יחד עם "+fl.length+" קבצים?")) return; await sb.storage.from("plans").remove(fl); }
      P.plans.splice(i,1); re(); }; });
    document.querySelectorAll('[data-upl]').forEach(function(inp){ inp.onchange=async function(){
      var i=+inp.dataset.upl, f=inp.files[0]; if(!f) return;
      if(f.size>50*1024*1024){ setStat("קובץ גדול מדי (עד 50MB)",true); return; }
      setStat("מעלה קובץ…");
      var ext=(f.name.match(/\.[A-Za-z0-9]{1,8}$/)||[""])[0].toLowerCase();
      var id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2));
      var path=P.id+"/"+id+ext;
      var r=await sb.storage.from("plans").upload(path,f,{contentType:f.type||"application/octet-stream"});
      if(r.error){ setStat("העלאת הקובץ נכשלה",true); return; }
      P.plans[i].files=P.plans[i].files||[]; P.plans[i].files.push({path:path,name:f.name,at:today()}); re(); }; });
    document.querySelectorAll('[data-delfile]').forEach(function(el){ el.onclick=async function(){
      var a=el.dataset.delfile.split(":"), i=+a[0], j=+a[1], f=P.plans[i].files[j];
      if(!confirm('למחוק את הקובץ "'+f.name+'"?')) return;
      await sb.storage.from("plans").remove([f.path]); P.plans[i].files.splice(j,1); re(); }; });
    wireFiles();
    document.querySelectorAll('[data-dupl]').forEach(function(inp){ inp.onchange=async function(){
      var f=inp.files[0], internal=inp.dataset.dupl==="int"; if(!f) return;
      if(f.size>50*1024*1024){ setStat("קובץ גדול מדי (עד 50MB)",true); return; }
      setStat("מעלה קובץ…");
      var path=P.id+"/"+(internal?"internal":"docs")+"/"+newId()+fileExt(f.name);
      var r=await sb.storage.from("plans").upload(path,f,{contentType:f.type||"application/octet-stream"});
      if(r.error){ setStat("העלאת הקובץ נכשלה",true); return; }
      P.docs.push({path:path,name:f.name,at:today(),internal:internal}); re(); }; });
    document.querySelectorAll('[data-deldoc]').forEach(function(el){ el.onclick=async function(){
      var j=+el.dataset.deldoc, f=P.docs[j];
      if(!confirm('למחוק את המסמך "'+f.name+'"?')) return;
      await sb.storage.from("plans").remove([f.path]); P.docs.splice(j,1); re(); }; });
    // budget lines
    var abl=$("addBL"); if(abl) abl.onclick=function(){ P.budgetLines.push({nm:"",amount:0,paid:0,status:"offer"}); re(); };
    document.querySelectorAll('[data-bf]').forEach(function(el){ el.onchange=function(){ var k=el.dataset.bf; P.budgetLines[+el.dataset.i][k]= k==="nm"?el.value:(+el.value||0); re(); }; });
    document.querySelectorAll('[data-bstat]').forEach(function(el){ el.onclick=function(){ var l=P.budgetLines[+el.dataset.bstat]; l.status=({commit:"offer",offer:"est",est:"commit"})[l.status]||"commit"; re(); }; });
    document.querySelectorAll('[data-delbl]').forEach(function(el){ el.onclick=function(){ P.budgetLines.splice(+el.dataset.delbl,1); re(); }; });
    // tasks
    var at=$("addTask"); if(at) at.onclick=function(){ P.tasks.push({t:"",pri:"mid",due:"",done:false}); re(); };
    document.querySelectorAll('[data-tdone]').forEach(function(el){ el.onchange=function(){ P.tasks[+el.dataset.tdone].done=el.checked; re(); }; });
    document.querySelectorAll('[data-tf]').forEach(function(el){ el.onchange=function(){ P.tasks[+el.dataset.i][el.dataset.tf]=el.value; save(P); }; });
    document.querySelectorAll('[data-tpri]').forEach(function(el){ el.onclick=function(){ var t=P.tasks[+el.dataset.tpri]; t.pri=({hi:"mid",mid:"lo",lo:"hi"})[t.pri]||"mid"; re(); }; });
    document.querySelectorAll('[data-deltask]').forEach(function(el){ el.onclick=function(){ P.tasks.splice(+el.dataset.deltask,1); re(); }; });
    // journal
    $("jAdd").onclick=function(){ var tx=$("jText").value.trim(); if(!tx) return; P.journal.push({date:$("jDate").value||today(),text:tx}); re(); };
    document.querySelectorAll('[data-deljr]').forEach(function(el){ el.onclick=function(){ if(!confirm("למחוק את הרשומה מהיומן?")) return; P.journal.splice(+el.dataset.deljr,1); re(); }; });
    document.querySelectorAll('[data-pfield]').forEach(function(el){ el.onchange=function(){ P.plans[+el.dataset.i][el.dataset.pfield]=el.value; save(P); }; });
  }

  async function loadClientFiles(P){

    var sumR=0, sumQ=0;

    rows.forEach(function(f){
      var k=KIND[f.kind]?f.kind:"other"; if(k==="receipt") sumR+=(+f.amount||0); if(k==="quote") sumQ+=(+f.amount||0);
      var canDel=S.role==="admin"||f.uploader_role==="client";
      h+='<tr><td><a class="plink" data-file="'+esc(f.path)+'">'+esc(f.name)+'</a></td><td><span class="tag ro '+KC[k]+'">'+KIND[k]+'</span></td>'+
         '<td class="money">'+(f.amount!=null?money(f.amount):'')+'</td><td>'+esc(f.note)+'</td><td>'+esc(fmtDate(f.created_at))+'</td>'+
         '<td>'+(f.uploader_role==="admin"?"המעצבת":"הלקוח")+'</td>'+
         '<td>'+(canDel?'<button class="delx" aria-label="מחיקת המסמך" data-delcf="'+esc(f.id)+'" data-path="'+esc(f.path)+'">×</button>':'')+'</td></tr>';
    });
    h+='</table>';
    if(sumR||sumQ) h+='<div class="hint">סה״כ קבלות: <b>'+money(sumR)+'</b> · סה״כ הצעות מחיר: <b>'+money(sumQ)+'</b> (לפי הסכומים שהוזנו)</div>';
    el.innerHTML=h; wireFiles();
    document.querySelectorAll('[data-delcf]').forEach(function(b){ b.onclick=async function(){
      if(!confirm("למחוק את המסמך?")) return;
      await sb.storage.from("plans").remove([b.dataset.path]);
      await sb.from("client_files").delete().eq("id",b.dataset.delcf); loadClientFiles(P); }; });
  }
  function wireClientFiles(P){
    var btn=$("cfAdd"); if(!btn) return;
    btn.onclick=async function(){
      var f=$("cfFile").files[0], err=$("cfErr"); err.style.color=""; err.textContent="";
      if(!f){ err.textContent="יש לבחור קובץ"; return; }
      if(f.size>50*1024*1024){ err.textContent="קובץ גדול מדי (עד 50MB)"; return; }
      btn.disabled=true; err.style.color="var(--muted)"; err.textContent="מעלה…";
      var path=P.id+"/client/"+newId()+fileExt(f.name);
      var u=await sb.storage.from("plans").upload(path,f,{contentType:f.type||"application/octet-stream"});
      if(u.error){ btn.disabled=false; err.style.color=""; err.textContent="ההעלאה נכשלה — נסו שוב"; return; }
      var amt=$("cfAmount").value;
      var r=await sb.from("client_files").insert({project_id:P.id,path:path,name:f.name,kind:$("cfKind").value,amount:amt===""?null:(+amt||0),note:$("cfNote").value.trim(),uploader_role:S.role});
      btn.disabled=false;
      if(r.error){ await sb.storage.from("plans").remove([path]); err.style.color=""; err.textContent="השמירה נכשלה — נסו שוב"; return; }
      err.textContent=""; $("cfFile").value=""; $("cfAmount").value=""; $("cfNote").value="";
      loadClientFiles(P);
    };
    loadClientFiles(P);
  }
  function renderClient(P, preview){
    var m=$("main"), V=P.vis||{};
    function can(k){ return V[k]!==false; }
    var dl=can("shopping")?daysLeft(P.shoppingDeadline):null;
    var closed=P.suppliers.filter(function(s){return s.status==="ok";}).length;
    var totalFee=P.payments.reduce(function(a,b){return a+(+b.amount||0);},0);
    var next=P.stages.filter(function(s){return (+s.pct||0)<100;})[0];
    var h='';
    if(preview) h+='<div class="pvbanner" role="status">תצוגת לקוח — כך הלקוח רואה את הפרויקט. כבי את המתג למעלה כדי לחזור למסך המלא שלך.</div>';
    h+='<div class="grid">';
    h+='<div class="card"><h3>התקדמות הפרויקט</h3><div class="kpi">'+overall(P)+'<small>%</small></div><div class="bar" style="margin-top:10px"><i style="width:'+overall(P)+'%"></i></div><div class="klabel">'+(next?'שלב נוכחי: '+esc(next.nm):'כל השלבים הושלמו')+'</div></div>';
    if(dl!=null) h+='<div class="card"><h3>ימי רכישות שנותרו</h3><div class="kpi">'+dl+' <small>ימים</small></div><div class="klabel">לסיום שלב הרכש</div></div>';
    if(can("suppliers")&&P.suppliers.length) h+='<div class="card"><h3>אנשי מקצוע סגורים</h3><div class="kpi">'+closed+' <small>/ '+P.suppliers.length+'</small></div><div class="klabel">ספקים שכבר נסגרו</div></div>';
    h+='</div>';
    h+='<div class="sectitle">שלבי הפרויקט</div><div class="card">'+stagesHtml(P,false)+'</div>';
    if(can("payments")&&totalFee>0) h+='<div class="sectitle">שלבי תשלום</div><div class="card">'+paymentsTable(P,false)+'</div>';
    if(can("suppliers")&&P.suppliers.length) h+='<div class="sectitle">ספקים · סגורים ולא סגורים</div><div class="card">'+suppliersTable(P,false)+'</div>';
    if(can("plans")&&P.plans.length) h+='<div class="sectitle">תוכניות עבודה</div><div class="card">'+plansTable(P,false)+'</div>';
    if(can("docs")&&P.docs.length) h+='<div class="sectitle">מסמכי הפרויקט</div><div class="card">'+docsHtml(P,false)+'</div>';
    if(can("uploads")) h+='<div class="sectitle">המסמכים שלי · קבלות והצעות מחיר</div><div class="card">'+clientFilesBox()+'</div>';
    if(can("chat")) h+='<div class="sectitle">הודעות · שאלות למעצבת</div><div class="card">'+chatBox()+'</div>';
    h+='<div class="foot">מערכת ניהול הפרויקט · '+esc(P.designer)+'</div>';
    m.innerHTML=h;
    wireFiles();
    if(can("chat")) wireChat(P);
    if(can("uploads")) wireClientFiles(P);
  }

  /* ===== home tabs: today / contacts / inbox ===== */
  function tabsBar(){
    var T=[["today","הבוקר שלי"],["projects","פרויקטים"],["contacts","ספקים ואנשי קשר"],["inbox","מהמייל"]];
    return '<div class="tabs" role="tablist">'+T.map(function(t){ var on=S.tab===t[0];
      return '<button role="tab" aria-selected="'+(on?'true':'false')+'" class="tab'+(on?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'; }).join("")+'</div>';
  }
  function wireTabs(){ document.querySelectorAll('[data-tab]').forEach(function(el){ el.onclick=function(){ S.tab=el.dataset.tab; renderHome(); }; }); }
  function plusDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  async function renderToday(){
    var body=$("tabBody"); body.innerHTML='<div class="hint">טוען…</div>';
    var waiting={}, newFiles={};
    try{
      var r=await sb.from("messages").select("project_id,sender_role,created_at").order("created_at",{ascending:false}).limit(300);
      var seen={}; (r.data||[]).forEach(function(x){ if(seen[x.project_id]) return; seen[x.project_id]=1; if(x.sender_role==="client") waiting[x.project_id]=1; });
      var f=await sb.from("client_files").select("project_id,uploader_role,created_at").gte("created_at",new Date(Date.now()-7*864e5).toISOString()).limit(500);
      (f.data||[]).forEach(function(x){ if(x.uploader_role==="client") newFiles[x.project_id]=(newFiles[x.project_id]||0)+1; });
    }catch(e){}
    body=$("tabBody"); if(S.tab!=="today"||S.view!=="home"||!body) return;
    var td=today(), wk=plusDays(7), key="studioTicks:"+td, ticks={};
    try{ ticks=JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){}
    var hr=new Date().getHours(), greet=hr<12?"בוקר טוב":(hr<18?"צהריים טובים":"ערב טוב");
    var h='<div class="sectitle">'+greet+' · מה על הפרק היום ('+fmtDate(td)+')</div>', any=false;
    S.projects.forEach(function(P){
      var it=[];
      P.tasks.forEach(function(t,i){ if(t.done||!t.t) return;
        if(t.due&&t.due<=wk) it.push({task:i,txt:t.t,tag:t.due<td?"באיחור":(t.due===td?"היום":fmtDate(t.due)),bad:t.due<=td});
        else if(!t.due&&t.pri==="hi") it.push({task:i,txt:t.t,tag:"עדיפות גבוהה"}); });
      if(waiting[P.id]) it.push({id:"msg",txt:"לענות להודעת הלקוח",tag:"ממתין",bad:true});
      if(newFiles[P.id]) it.push({id:"cf",txt:"לעבור על "+newFiles[P.id]+" מסמכים שהלקוח העלה השבוע"});
      var open=P.suppliers.filter(function(x){return x.status!=="ok";}).map(function(x){return x.nm;});
      if(open.length) it.push({id:"sup",txt:"ספקים פתוחים: "+open.slice(0,4).join(", ")+(open.length>4?" ועוד "+(open.length-4):"")});
      var pl=P.plans.filter(function(x){return x.status!=="done";}).length;
      if(pl) it.push({id:"pl",txt:pl+" תוכניות עבודה שלא הושלמו"});
      var np=P.payments.filter(function(x){return !x.paid;})[0];
      if(np) it.push({id:"pay",txt:"תשלום הבא מהלקוח: "+np.title+" · "+money(np.amount)});
      var dl=daysLeft(P.shoppingDeadline);
      if(dl!=null&&dl<=14) it.push({id:"shop",txt:dl<0?"יעד הרכישות עבר":("נותרו "+dl+" ימים ליעד הרכישות"),bad:dl<3});
      if(!it.length) return; any=true;
      h+='<div class="card" style="margin-bottom:12px"><h3><a class="plink" data-open="'+esc(P.id)+'">'+esc(P.name)+'</a><span class="role-pill">'+overall(P)+'%</span></h3>';
      it.forEach(function(x){
        var tk=x.task!=null, idk=P.id+":"+(tk?("t"+x.task):x.id), on=!tk&&ticks[idk];
        h+='<label class="chk'+(on?' done':'')+'"><input type="checkbox" '+(tk?'data-ttask="'+esc(P.id)+':'+x.task+'"':'data-tick="'+esc(idk)+'"')+(on?' checked':'')+'><span>'+esc(x.txt)+'</span>'+
           (x.tag?'<span class="tag ro '+(x.bad?'no':'todo')+'">'+esc(x.tag)+'</span>':'')+'</label>';
      });
      h+='</div>';
    });
    if(!any) h+='<div class="card"><div class="hint" style="margin:0">אין כרגע משימות פתוחות או דברים שמחכים לך. </div></div>';
    h+='<div class="hint">סימון משימה כאן מסמן אותה כבוצעה בפרויקט. שאר הסימונים הם תזכורת יומית שנשמרת במכשיר הזה ומתאפסת מחר.</div>';
    body.innerHTML=h;
    document.querySelectorAll('#tabBody [data-open]').forEach(function(el){ el.onclick=function(){ S.activeId=el.dataset.open; S.view="project"; S.preview=false; renderApp(); window.scrollTo(0,0); }; });
    document.querySelectorAll('[data-tick]').forEach(function(el){ el.onchange=function(){ ticks[el.dataset.tick]=el.checked; try{ localStorage.setItem(key,JSON.stringify(ticks)); }catch(e){} el.parentNode.classList.toggle("done",el.checked); }; });
    document.querySelectorAll('[data-ttask]').forEach(function(el){ el.onchange=function(){ var a=el.dataset.ttask.split(":"), P=byId(a[0]); if(!P) return; P.tasks[+a[1]].done=true; save(P); renderToday(); }; });
  }
  function safeUrl(u){ u=(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u; return u; }
  async function renderContacts(){
    var body=$("tabBody"); body.innerHTML='<div class="hint">טוען…</div>';
    var r=await sb.from("contacts").select("*").order("created_at",{ascending:true});
    if(S.tab!=="contacts"||!$("tabBody")) return;
    S.contacts=r.error?[]:(r.data||[]); drawContacts();
  }
  function drawContacts(){
    var body=$("tabBody"); if(!body) return;
    var h='<div class="sectitle">ספקים ואנשי קשר<button class="btn primary sm" id="ctAdd">+ איש קשר</button></div><div class="card">';
    if(!S.contacts.length) h+='<div class="hint" style="margin:0">הרשימה ריקה. הוסיפי ספקים, קבלנים ויועצים שאת עובדת איתם, כולל אחוז העמלה שסוכם.</div>';
    else {
      h+='<table class="wide"><tr><th>שם</th><th>תחום</th><th>איש קשר</th><th>טלפון</th><th>מייל</th><th>אתר / קישור</th><th>עמלה %</th><th>הערות</th><th>קישורים</th><th></th></tr>';
      S.contacts.forEach(function(c){
        function inp(f,w,extra){ return '<input class="ipt" style="min-width:'+w+'px" aria-label="'+f+'" data-ct="'+f+'" data-id="'+esc(c.id)+'" value="'+esc(c[f]==null?"":c[f])+'" '+(extra||"")+'>'; }
        var links=[]; if(c.phone) links.push('<a class="plink" href="tel:'+esc(c.phone.replace(/[^0-9+*#]/g,""))+'">חיוג</a>');
        if(c.email) links.push('<a class="plink" href="mailto:'+esc(c.email)+'">מייל</a>');
        if(c.url) links.push('<a class="plink" target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(c.url))+'">אתר</a>');
        h+='<tr><td>'+inp("name",120)+'</td><td>'+inp("trade",100)+'</td><td>'+inp("person",100)+'</td><td>'+inp("phone",110,'dir="ltr" inputmode="tel"')+'</td><td>'+inp("email",150,'dir="ltr" type="email"')+'</td>'+
           '<td>'+inp("url",150,'dir="ltr"')+'</td><td>'+inp("commission_pct",60,'type="number" step="0.5" min="0" max="100"')+'</td><td>'+inp("notes",160)+'</td>'+
           '<td style="white-space:nowrap">'+links.join(" · ")+'</td><td><button class="delx" aria-label="מחיקת איש הקשר" data-delct="'+esc(c.id)+'">×</button></td></tr>';
      });
      h+='</table>';
    }
    h+='</div><div class="hint">הרשימה פנימית לסטודיו ואינה מוצגת ללקוחות. אחוז העמלה הוא לתיעוד בלבד.</div><div class="err" id="ctErr" role="status"></div>';
    body.innerHTML=h;
    $("ctAdd").onclick=async function(){ var r=await sb.from("contacts").insert({name:"ספק חדש"}).select().single(); if(r.error){ $("ctErr").textContent="לא נשמר — נסי שוב"; return; } S.contacts.push(r.data); drawContacts(); };
    document.querySelectorAll('[data-ct]').forEach(function(el){ el.onchange=async function(){
      var f=el.dataset.ct, v=el.value, c=S.contacts.filter(function(x){return x.id===el.dataset.id;})[0]; if(!c) return;
      if(f==="commission_pct") v=(v===""?null:(+v||0)); c[f]=v; var u={}; u[f]=v;
      var r=await sb.from("contacts").update(u).eq("id",c.id); $("ctErr").textContent=r.error?"השינוי לא נשמר — בדקי חיבור":"";
      if(f==="phone"||f==="email"||f==="url") drawContacts(); }; });
    document.querySelectorAll('[data-delct]').forEach(function(el){ el.onclick=async function(){ if(!confirm("למחוק את איש הקשר?")) return;
      var r=await sb.from("contacts").delete().eq("id",el.dataset.delct); if(r.error) return; S.contacts=S.contacts.filter(function(x){return x.id!==el.dataset.delct;}); drawContacts(); }; });
  }
  var IK={quote:"הצעת מחיר",meeting:"תיאום פגישה",question:"שאלה / תשובה",other:"אחר"}, IC={quote:"wait",meeting:"ok",question:"no",other:"todo"};
  async function renderInbox(){
    var body=$("tabBody"); body.innerHTML='<div class="hint">טוען…</div>';
    var r=await sb.from("inbox_items").select("*").order("received_at",{ascending:false}).limit(200);
    if(S.tab!=="inbox"||!$("tabBody")) return;
    var rows=r.error?[]:(r.data||[]);
    var h='<div class="sectitle">מהמייל · הצעות מחיר, תיאומים ותשובות<a class="btn primary sm" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://mail.google.com/">פתיחת תיבת המייל</a></div><div class="card">';
    if(!rows.length) h+='<div class="hint" style="margin:0">עדיין לא רוכזו כאן פריטים מהמייל. הפריטים נאספים מתיבת המייל העסקית ומופיעים כאן עם קישור למייל המקורי.</div>';
    else {
      h+='<table class="wide"><tr><th>טופל</th><th>תאריך</th><th>סוג</th><th>מאת</th><th>נושא ותקציר</th><th>פרויקט</th><th>קישור</th><th></th></tr>';
      rows.forEach(function(x){ var k=IK[x.kind]?x.kind:"other";
        var opts='<option value="">—</option>'+S.projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===x.project_id?' selected':'')+'>'+esc(p.name)+'</option>'; }).join("");
        var lk=/^https:\/\//i.test(x.link||"")?'<a class="plink" target="_blank" rel="noopener noreferrer" href="'+esc(x.link)+'">פתיחה</a>':'';
        h+='<tr'+(x.done?' style="opacity:.5"':'')+'><td><input type="checkbox" aria-label="סימון כטופל" data-ibdone="'+x.id+'"'+(x.done?' checked':'')+'></td><td style="white-space:nowrap">'+esc(fmtDate(x.received_at))+'</td>'+
           '<td><span class="tag ro '+IC[k]+'">'+IK[k]+'</span></td><td>'+esc(x.from_name||x.from_email)+'</td><td><b>'+esc(x.subject)+'</b><div style="color:var(--muted)">'+esc(x.summary)+'</div></td>'+
           '<td><select class="ipt" aria-label="שיוך לפרויקט" data-ibproj="'+x.id+'">'+opts+'</select></td><td>'+lk+'</td><td><button class="delx" aria-label="הסרה מהרשימה" data-ibdel="'+x.id+'">×</button></td></tr>'; });
      h+='</table>';
    }
    h+='</div>';
    body.innerHTML=h;
    document.querySelectorAll('[data-ibdone]').forEach(function(el){ el.onchange=async function(){ await sb.from("inbox_items").update({done:el.checked}).eq("id",+el.dataset.ibdone); renderInbox(); }; });
    document.querySelectorAll('[data-ibproj]').forEach(function(el){ el.onchange=async function(){ await sb.from("inbox_items").update({project_id:el.value||null}).eq("id",+el.dataset.ibproj); }; });
    document.querySelectorAll('[data-ibdel]').forEach(function(el){ el.onclick=async function(){ if(!confirm("להסיר את הפריט מהרשימה? המייל עצמו לא נמחק.")) return; await sb.from("inbox_items").delete().eq("id",+el.dataset.ibdel); renderInbox(); }; });
  }

  /* ===== boot ===== */
  var recovering=false;
  sb.auth.onAuthStateChange(function(ev){ if(ev==="PASSWORD_RECOVERY"){ recovering=true; renderNewPass(); } });
  sb.auth.getSession().then(function(r){
    if(recovering) return;
    if(r.data&&r.data.session) enter(); else renderLogin();
  });
  window.addEventListener("beforeunload",function(){ if(Object.keys(pending).length) flush(); });

  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
